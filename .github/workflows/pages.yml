name: Deploy XYCHEN blog to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # 定时自愈：每天部署最新 main，避免 push 事件被丢弃时站点长期停留在旧版本
    - cron: '0 4,16 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file modification times from git
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            t=$(git log -1 --format=%ct -- "$file")
            if [ -n "$t" ]; then touch -d "@$t" "$file"; fi
          done
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
