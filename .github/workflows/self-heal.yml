name: Self-heal XYCHEN blog deployment

# 兜底：每天两次用最新 main 重新构建部署，覆盖"push 事件被 GitHub 丢弃"的情况。
# 单独成文件是必须的：它含 schedule，会被 GitHub 当作 scheduled workflow，60 天
# 仓库无活动后自动禁用。被禁时丢的只是兜底，deploy.yml（纯 push）不受影响。
on:
  schedule:
    # 北京时间 12:00 / 00:00
    - cron: '0 4,16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 与 deploy.yml 分开，避免定时任务 cancel 掉正在进行的 push 部署
  group: pages-self-heal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file modification times from git
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            t=$(git log -1 --format=%ct -- "$file")
            if [ -n "$t" ]; then touch -d "@$t" "$file"; fi
          done
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
